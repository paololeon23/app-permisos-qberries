# Netlify — Pase de salida Q Berries
[build]
  publish = "."
  functions = "netlify/functions"

# Evitar falso positivo del secrets scan en docs/scripts locales
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "SECRETS.netlify.txt,apps-script/**,README.md"

# Rutas amigables del proxy (gratis con Functions)
[[redirects]]
  from = "/api/permisos"
  to = "/.netlify/functions/permisos"
  status = 200

[[redirects]]
  from = "/api/trabajadores"
  to = "/.netlify/functions/trabajadores"
  status = 200

# No cachear APIs
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
