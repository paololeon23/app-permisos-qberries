<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Q Berries</title>
  <style>
    :root {
      --brand: #1b6b3a;
      --berry: #c43b4e;
      --ink: #12201a;
      --muted: #5c6b63;
      --line: #d7e3db;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #e8efe9;
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    .screen-bar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(6px);
    }

    .screen-bar button,
    .screen-bar a {
      appearance: none;
      border: none;
      border-radius: 10px;
      min-height: 42px;
      padding: 0 16px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-print {
      background: var(--brand);
      color: #fff;
    }

    .btn-ghost {
      background: #fff;
      color: var(--brand);
      border: 1px solid var(--brand);
    }

    .hint {
      width: min(720px, 94vw);
      margin: 14px auto 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fff8e8;
      border: 1px solid #f0d9a0;
      color: #7a5b12;
      font-size: 0.86rem;
      line-height: 1.4;
      text-align: center;
    }

    .page {
      width: min(800px, 96vw);
      margin: 18px auto 40px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(18, 32, 26, 0.08);
      padding: 36px 28px 40px;
      text-align: center;
    }

    .logo {
      width: 96px;
      height: auto;
      object-fit: contain;
      margin: 0 auto 10px;
      display: block;
    }

    .brand {
      margin: 0;
      color: var(--berry);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 0;
      font-size: clamp(1.6rem, 3.4vw, 2.2rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .tagline {
      margin: 10px auto 0;
      max-width: 26em;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.4;
    }

    .qr-wrap {
      margin: 28px auto 0;
      width: min(420px, 78vw);
      padding: 18px;
      border: 2px solid var(--brand);
      border-radius: 18px;
      background:
        linear-gradient(#fff, #fff) padding-box,
        linear-gradient(180deg, #eef7f1, #fff) border-box;
    }

    .qr {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: -webkit-optimize-contrast;
      background: #fff;
    }

    .scan-line {
      margin: 18px 0 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--brand);
    }

    .footer-note {
      margin: 22px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    @page {
      size: A4 portrait;
      margin: 12mm;
    }

    @media print {
      html, body {
        background: #fff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .screen-bar,
      .hint {
        display: none !important;
      }

      .page {
        width: 100%;
        max-width: none;
        margin: 0;
        border: none;
        border-radius: 0;
        box-shadow: none;
        padding: 8mm 6mm;
        min-height: auto;
      }

      .logo { width: 28mm; }

      h1 { font-size: 26pt; }

      .tagline { font-size: 12pt; }

      .qr-wrap {
        width: 110mm;
        margin-top: 14mm;
        padding: 6mm;
      }

      .scan-line { font-size: 14pt; margin-top: 8mm; }

      .footer-note { font-size: 9pt; margin-top: 8mm; }
    }
  </style>
</head>
<body>
  <div class="screen-bar" aria-hidden="false">
    <button type="button" class="btn-print" id="btnPrint">Imprimir / Guardar PDF</button>
    <a class="btn-ghost" href="./index.html">Volver a la app</a>
  </div>

  <p class="hint">
    Al imprimir: desmarque <strong>Encabezados y pies de página</strong> (Headers and footers)
    para que no salga la ruta ni la fecha/hora.
  </p>

  <main class="page">
    <img class="logo" src="./assets/logo-qberries.png" alt="Q Berries" />
    <p class="brand">Q Berries</p>
    <h1>Pase de salida</h1>
    <p class="tagline">Escanee el código con la cámara del celular para instalar la aplicación.</p>

    <div class="qr-wrap">
      <img
        class="qr"
        src="./assets/qr-instalar.png"
        width="512"
        height="512"
        alt="Código QR de instalación"
      />
    </div>

    <p class="scan-line">Escanee aquí</p>
    <p class="footer-note">Uso interno · Control de salidas laborales</p>
  </main>

  <script>
    document.getElementById('btnPrint').addEventListener('click', function () {
      // Título corto: si el navegador imprime encabezado, no muestra file:// feo
      document.title = 'Q Berries';
      window.print();
    });
  </script>
</body>
</html>
