<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b6b3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <title>Pase de salida</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1b6b3a;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .box { padding: 24px; }
    img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 12px; }
    p { margin: 8px 0 0; opacity: 0.9; font-size: 0.95rem; }
    a {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 18px;
      border-radius: 10px;
      background: #fff;
      color: #1b6b3a;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="./assets/logo-qberries-white.png" alt="Q Berries" />
    <div id="txt">Abriendo…</div>
    <p id="sub"></p>
    <a id="go" href="./index.html" hidden>Continuar</a>
  </div>
  <script>
    (function () {
      var txt = document.getElementById('txt');
      var sub = document.getElementById('sub');
      var go = document.getElementById('go');
      var standalone =
        window.matchMedia('(display-mode: standalone)').matches ||
        navigator.standalone === true;

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js', { scope: './' }).catch(function () {});
      }

      // Ya está en modo app → ir directo al registro
      if (standalone) {
        location.replace('./index.html');
        return;
      }

      // Si Chrome ya la tiene instalada, handle_links debería abrir la app.
      // Si igual caemos aquí (primera vez), mandar a instalar.
      async function boot() {
        try {
          if (navigator.getInstalledRelatedApps) {
            var apps = await navigator.getInstalledRelatedApps();
            if (apps && apps.length) {
              txt.textContent = 'App instalada';
              sub.textContent = 'Ábrala desde el ícono «Pase salida» en la pantalla de inicio.';
              go.hidden = false;
              go.textContent = 'Abrir aquí';
              go.href = './index.html';
              return;
            }
          }
        } catch (_) {}

        // Primera vez: instalar (Android mostrará el diálogo)
        location.replace('./instalar.html');
      }

      boot();
    })();
  </script>
</body>
</html>
